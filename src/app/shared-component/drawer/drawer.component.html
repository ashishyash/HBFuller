<p-drawer [(visible)]="visible" position="right">
    <ng-template pTemplate="header">
        <div class="custom-drawer-header">
            <span class="custom-close-icon cursor-pointer" (click)="resetVisibility()">
                <i class="pi pi-angle-double-right"></i> </span>
        </div>
    </ng-template>
    <div class="my-3">
        <p-selectbutton [options]="stateOptions" [(ngModel)]="value" optionLabel="label" optionValue="value"
            aria-labelledby="basic"></p-selectbutton>
        @if(value === 'myCampaignActionItems'){
        <app-action-item [actionItemHeading]="actionItemHeading" [actionItems]="actionItems"></app-action-item>
        }@if(value === 'notifications'){
        <app-action-item [actionItemHeading]="notificationHeading"
            [actionItems]="notificationActionItems"></app-action-item>
        }@if(value === 'trainingLinks'){
        <app-action-item [actionItemHeading]="trainingHeading" [actionItems]="trainingActionItems"></app-action-item>
        }

    </div>
</p-drawer>

<div class="p-2">
    <div class="grid">
        <p-breadcrumb  [model]="items">
            <ng-template #item let-item>
                <ng-container *ngIf="item.route; else elseBlock">
                    <a [routerLink]="item.route" class="p-breadcrumb-item-link">
                        <span class="text-primary font-semibold">{{ item.label }}</span>
                    </a>
                </ng-container>
                <ng-template #elseBlock>
                    <a>
                        <span class="text-color">{{ item.label }}</span>
                    </a>
                </ng-template>
            </ng-template>
        </p-breadcrumb>
    </div>
    <div class="my-3">
        <p-selectbutton [options]="stateOptions" [(ngModel)]="value" optionLabel="label" optionValue="value"
            aria-labelledby="basic" />
    </div>
    <div class="grid">
        <div class="col">
            <app-filter-component></app-filter-component>
        </div>
        @if (chartData) {
            <div class="col">
                <h3 class="font-bold mb-3">Performance</h3>
                <div class="grid">
                    <div class="col">
                        <p-card class="flex flex-column">
                            <h4 class="p-2 text-green-500">Sales $</h4>
                            <app-chart [chartData]="salesChartData"></app-chart>
                            <!-- <app-customers-table [data]="salesData" [columns]="salesColumn"
                                [showCustomerCount]="false"></app-customers-table> -->
                        </p-card>
                    </div>
                    <div class="col">
                        <p-card class="flex flex-column">
                            <p-select [options]="contributionTypeData" [(ngModel)]="selectedContributionType" optionLabel="name" placeholder="Contribution Type" />
                            @if (selectedContributionType.value === '%') {
                                <app-chart [chartData]="contributionChartData"></app-chart>
                            }
                            @if (selectedContributionType.value === '$') {
                                <app-chart [chartData]="contributionChartDataPercent"></app-chart>
                            }  
                            <!-- <app-customers-table [data]="marginData" [columns]="marginColumn"
                                [showCustomerCount]="false"></app-customers-table> -->
                        </p-card>
                    </div>
                    
                </div>
            </div>
        }
        
    </div>
</div>
